name = "nc_cubic_stacks"
version = "0.1.0"
defaultTargets = ["NcCubicStacks", "NcCubicStacksAudit"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[require]]
name = "Stacks"
git = "https://github.com/AxiomMath/Stacks.git"
rev = "5ed82d14634e8d9576bb844c7bd4e3da66d450e7"

[[lean_lib]]
name = "NcCubicStacks"
roots = ["NcCubicStacks"]

[[lean_lib]]
name = "NcCubicStacksCM"
roots = ["NcCubicStacksCM"]

[[lean_lib]]
name = "NcCubicStacksAudit"
roots = ["NcCubicStacksAudit"]
